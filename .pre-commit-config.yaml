# Checks of every commit (pre-commit) and of its message (commit-msg): `pre-commit install` sets up both.
# The settings of the tools live in pyproject.toml; code lines are 88 characters (the Black and Ruff default).
minimum_pre_commit_version: "3.2.0"
default_install_hook_types: [pre-commit, commit-msg]
repos:
  # The title of a commit by Conventional Commits: «docs: ответить на вопросы о GitHub Issues»
  # (https://github.com/SENATOROVAI/intro-cs/issues/20). Merge commits pass.
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.5.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]

  # Hygiene: big files, keys, merge leftovers, broken YAML/JSON, work in main, stray spaces.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: detect-private-key
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: no-commit-to-branch
        args: [--branch, main]
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]

  # Every notebook gets its .py twin: the review reads the .py.
  - repo: https://github.com/mwouts/jupytext
    rev: v1.19.6
    hooks:
      - id: jupytext
        args: [--from=ipynb, --to=py:light, "--set-formats=ipynb,py:light", --quiet, --sync, --warn-only]
        exclude: '.*\.md$'

  # Ruff for .py and notebooks: the rules of flake8, pep8-naming, pydocstyle, isort and pyupgrade, and the format of Black.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/PyCQA/docformatter
    rev: v1.7.8
    hooks:
      - id: docformatter
        args: [--in-place, --style=google, --wrap-summaries=88, --wrap-descriptions=88]

  # Python code inside the markdown cells of notebooks.
  - repo: https://github.com/nbQA-dev/nbQA
    rev: 1.9.1
    hooks:
      - id: nbqa
        entry: nbqa blacken-docs
        name: nbqa-blacken-docs
        alias: nbqa-blacken-docs
        additional_dependencies: [blacken-docs]
        args: [--nbqa-md]

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        additional_dependencies: [tomli]
        args:
          - --ignore-regex=^\s*"image\/(jpeg|png|gif|bmp|tiff)":\s.*
          - --ignore-regex=[A-Za-z0-9+/]{100,}
          - "--skip=*.js,*.html,*.css,*.svg,*.json,*.png,*.jpg,*.yml,*.yaml"
        exclude: '^python/makarov/|^python/oop\.ipynb$'

  # Names Ruff does not check: no one-letter variables (VNE001), function names that tell what they do (FNE).
  - repo: https://github.com/PyCQA/flake8
    rev: 7.5.0
    hooks:
      - id: flake8
        args: ["--select=VNE001,FNE", "--exclude=.*,__init__.py"]
        additional_dependencies: [flake8-variables-names, flake8-functions-names]
  - repo: https://github.com/nbQA-dev/nbQA
    rev: 1.9.1
    hooks:
      - id: nbqa-flake8
        args: ["--select=VNE001,FNE", "--exclude=.*,__init__.py"]
        additional_dependencies: [flake8==7.5.0, flake8-variables-names, flake8-functions-names]

  # Types: mypy, strict ([tool.mypy] of pyproject.toml), for .py and notebooks.
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.1
    hooks:
      - id: mypy
        additional_dependencies: &mypy_deps [numpy, pandas-stubs, types-requests, types-PyYAML, types-setuptools]
  - repo: https://github.com/nbQA-dev/nbQA
    rev: 1.9.1
    hooks:
      - id: nbqa-mypy
        additional_dependencies: [mypy==2.4.1, numpy, pandas-stubs, types-requests, types-PyYAML, types-setuptools]

  # pylint ([tool.pylint] of pyproject.toml) for .py and notebooks.
  - repo: https://github.com/pylint-dev/pylint
    rev: v4.1.3
    hooks:
      - id: pylint
  - repo: https://github.com/nbQA-dev/nbQA
    rev: 1.9.1
    hooks:
      - id: nbqa-pylint
        additional_dependencies: [pylint==4.1.3]
