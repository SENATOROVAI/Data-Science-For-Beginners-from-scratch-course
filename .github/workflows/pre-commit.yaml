name: pre-commit

on:
  pull_request:
    branches:
      - '*'
  push:
    branches:
      - '*'

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: pre-commit/action@v3.0.1
        env:
          # The check for commits made in main is for computers; CI also runs on main itself.
          SKIP: no-commit-to-branch
        with:
          extra_args: --all-files
